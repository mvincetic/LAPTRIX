name: LAPTRIX quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - if: matrix.shard == 1
        run: npm run check
      - name: Disable unused Chrome APT source on the ephemeral runner
        shell: bash
        run: |
          # Playwright downloads its own pinned Chromium; Ubuntu supplies system libraries.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv -- "$source" "$source.laptrix-disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - if: matrix.shard != 'production'
        run: npm run test:e2e -- --reporter=list --global-timeout=1200000 --shard=${{ matrix.shard }}/5
      - if: matrix.shard == 'production'
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
