name: LAPTRIX quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  blender:
    name: Blender source and GLB contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Disable unused Chrome APT source on the ephemeral runner
        shell: bash
        run: |
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv -- "$source" "$source.laptrix-disabled"
            fi
          done
      - name: Install headless Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libsm6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0
      - name: Install pinned official Blender after SHA-256 verification
        run: node scripts/install-blender-ci.mjs
      - run: npm run blender:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: blender-validation-results
          path: artifacts/blender
          retention-days: 7
  validate:
    name: validate (${{ matrix.kind }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: development, shard: 1, total: 6 }
          - { kind: development, shard: 2, total: 6 }
          - { kind: development, shard: 3, total: 6 }
          - { kind: development, shard: 4, total: 6 }
          - { kind: development, shard: 5, total: 6 }
          - { kind: development, shard: 6, total: 6 }
          - { kind: production, shard: 1, total: 2 }
          - { kind: production, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - if: matrix.kind == 'development' && matrix.shard == 1
        run: npm run check
      - name: Disable unused Chrome APT source on the ephemeral runner
        shell: bash
        run: |
          # Playwright downloads its own pinned Chromium; Ubuntu supplies system libraries.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv -- "$source" "$source.laptrix-disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - if: matrix.kind == 'development'
        run: npm run test:e2e -- --reporter=list --global-timeout=1200000 --shard=${{ matrix.shard }}/${{ matrix.total }}
      - if: matrix.kind == 'production'
        run: npm run test:production -- --reporter=list --global-timeout=1200000 --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.kind }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7
